<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Preview - {{ document.filename }}</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        font-family: Inter, Arial, sans-serif;

        background: #f3f4f6;

        color: #1f2937;

        min-height: 100vh;
      }

      /* ==========================================
           HEADER
        ========================================== */

      .preview-header {
        height: 70px;

        background: white;

        border-bottom: 1px solid #e5e7eb;

        display: flex;

        align-items: center;

        justify-content: space-between;

        padding: 0 25px;

        position: sticky;

        top: 0;

        z-index: 100;
      }

      .header-left {
        display: flex;

        align-items: center;

        gap: 15px;

        min-width: 0;
      }

      .back-button {
        text-decoration: none;

        background: #f3f4f6;

        color: #374151;

        padding: 9px 16px;

        border-radius: 8px;

        font-weight: 600;

        font-size: 14px;
      }

      .back-button:hover {
        background: #e5e7eb;
      }

      .filename {
        font-size: 16px;

        font-weight: 600;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;

        max-width: 550px;
      }

      .download-button {
        text-decoration: none;

        background: #2563eb;

        color: white;

        padding: 10px 18px;

        border-radius: 8px;

        font-size: 14px;

        font-weight: 600;
      }

      .download-button:hover {
        background: #1d4ed8;
      }

      /* ==========================================
           MAIN VIEWER
        ========================================== */

      .preview-area {
        width: 100%;

        height: calc(100vh - 70px);

        padding: 20px;
      }

      .viewer {
        width: 100%;

        height: 100%;

        background: white;

        border-radius: 12px;

        overflow: hidden;

        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }

      /* ==========================================
           PDF
        ========================================== */

      .pdf-viewer {
        width: 100%;

        height: 100%;

        border: none;

        display: block;
      }

      /* ==========================================
           IMAGE
        ========================================== */

      .image-viewer {
        width: 100%;

        height: 100%;

        display: flex;

        justify-content: center;

        align-items: center;

        padding: 30px;

        overflow: auto;

        background: #f8fafc;
      }

      .image-viewer img {
        max-width: 100%;

        max-height: 100%;

        object-fit: contain;

        border-radius: 8px;

        box-shadow: 0 3px 15px rgba(0, 0, 0, 0.12);
      }

      /* ==========================================
           UNSUPPORTED FILE
        ========================================== */

      .unsupported {
        width: 100%;

        height: 100%;

        display: flex;

        flex-direction: column;

        justify-content: center;

        align-items: center;

        text-align: center;

        padding: 30px;
      }

      .unsupported-icon {
        font-size: 64px;

        margin-bottom: 15px;
      }

      .unsupported h2 {
        margin: 0 0 10px;
      }

      .unsupported p {
        color: #6b7280;

        margin: 0 0 25px;
      }

      @media (max-width: 700px) {
        .preview-header {
          padding: 0 12px;
        }

        .filename {
          max-width: 180px;
        }

        .preview-area {
          padding: 10px;
        }

        .download-button {
          padding: 8px 12px;
        }
      }
    </style>
  </head>

  <body>
    <!-- ==========================================
         HEADER
    ========================================== -->

    <header class="preview-header">
      <div class="header-left">
        <a href="{{ url_for('dashboard') }}" class="back-button"> ← Back </a>

        <div class="filename" title="{{ document.filename }}">
          {{ document.filename }}
        </div>
      </div>

      <!-- ======================================
             DOWNLOAD BUTTON
        ======================================= -->

      <a
        href="{{ url_for(
                'download_document',
                document_id=document.id
            ) }}"
        class="download-button">
        ↓ Download
      </a>
    </header>

    <!-- ==========================================
         PREVIEW AREA
    ========================================== -->

    <main class="preview-area">
      <div class="viewer">
        {% if document.file_type in [ 'jpg', 'jpeg', 'png' ] %}

        <!-- =================================
                     IMAGE PREVIEW
                ================================== -->

        <div class="image-viewer">
          <img
            src="{{ url_for(
                            'preview_file',
                            document_id=document.id
                        ) }}"
            alt="{{ document.filename }}" />
        </div>

        {% elif document.file_type == 'pdf' %}

        <!-- =================================
                     PDF PREVIEW
                ================================== -->

        <iframe
          class="pdf-viewer"
          src="{{ url_for(
                        'preview_file',
                        document_id=document.id
                    ) }}"
          title="Document Preview"></iframe>

        {% else %}

        <!-- =================================
                     DOC / DOCX / TXT
                ================================== -->

        <div class="unsupported">
          <div class="unsupported-icon">📄</div>

          <h2>Preview unavailable</h2>

          <p>This file format cannot be displayed directly in the browser.</p>

          <a
            href="{{ url_for(
                            'download_document',
                            document_id=document.id
                        ) }}"
            class="download-button">
            ↓ Download File
          </a>
        </div>

        {% endif %}
      </div>
    </main>
  </body>
</html>
