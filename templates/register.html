<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="background-decor decor-1"></div>
    <div class="background-decor decor-2"></div>

    <div class="login-container">
      <div class="header">
        <h1>Create Your Account</h1>
        <p>It takes less than a minute</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %} {% endif %} {% endwith %}

      <form
        action="{{ url_for('auth.register') }}"
        method="POST"
        id="register-form"
        novalidate>
        <input type="hidden" name="next" value="{{ next }}" />

        <div class="input-group">
          <label for="name">Full name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Jordan Lee"
            autocomplete="name"
            required />
        </div>

        <div class="input-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="name@company.com"
            autocomplete="email"
            required />
          <span class="field-error" id="email-error"></span>
        </div>

        <div class="input-group">
          <label for="phone">Phone number</label>
          <div class="phone-input-wrapper">
            <select
              class="country-select"
              name="country_dial_code"
              id="country_dial_code">
              <option value="US" data-code="+1">🇺🇸 +1</option>
              <option value="IN" data-code="+91">🇮🇳 +91</option>
              <option value="GB" data-code="+44">🇬🇧 +44</option>
              <option value="CA" data-code="+1">🇨🇦 +1</option>
              <option value="AU" data-code="+61">🇦🇺 +61</option>
            </select>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="555 123 4567"
              autocomplete="tel"
              required />
          </div>
          <span class="field-error" id="phone-error"></span>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="At least 8 characters"
              autocomplete="new-password"
              required
              minlength="8" />
            <button
              type="button"
              class="password-toggle"
              data-toggle-for="password"
              aria-label="Show password">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="strength-meter">
            <div class="strength-meter-fill" id="strength-fill"></div>
          </div>
        </div>

        <div class="input-group">
          <label for="confirm_password">Confirm password</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            required />
          <span class="field-error" id="confirm-error"></span>
        </div>

        <button type="submit" class="login-btn" id="register-submit">
          <span class="btn-label">Create Account</span>
          <svg
            class="btn-arrow"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
          <span class="spinner"></span>
        </button>
      </form>

      <div class="divider"><span>or continue with</span></div>

      <a href="{{ url_for('auth.google_login') }}" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path
            fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path
            fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path
            fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
          <path
            fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
        </svg>
        Continue with Google
      </a>

      <p class="signup-text">
        Already have an account?
        <a href="{{ url_for('auth.login', next=next) }}">Log in</a>
      </p>
    </div>

    <script src="{{ url_for('static', filename='auth.js') }}">
      
    </script>
  </body>
</html>
