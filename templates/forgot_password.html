<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="background-decor decor-1"></div>
    <div class="background-decor decor-2"></div>

    <div class="login-container">
      <div class="header">
        <h1>Reset Your Password</h1>
        <p>Enter your account email and we'll send you a code.</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %} {% endif %} {% endwith %}

      <form
        action="{{ url_for('auth.forgot_password') }}"
        method="POST"
        id="forgot-form"
        novalidate>
        <div class="input-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="name@company.com"
            autocomplete="email"
            required />
          <span class="field-error" id="email-error"></span>
        </div>

        <button type="submit" class="login-btn" id="forgot-submit">
          <span class="btn-label">Send Reset Code</span>
          <svg
            class="btn-arrow"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
          <span class="spinner"></span>
        </button>
      </form>

      <a href="{{ url_for('auth.login') }}" class="back-link"
        >← Back to log in</a
      >
    </div>

    <script src="{{ url_for('static', filename='auth.js') }}"></script>
  </body>
</html>
