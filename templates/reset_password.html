<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set a New Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="background-decor decor-1"></div>
    <div class="background-decor decor-2"></div>

    <div class="login-container">
      <div class="header">
        <h1>Set a New Password</h1>
        <p>Choose something you haven't used before.</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %} {% endif %} {% endwith %}

      <form
        action="{{ url_for('auth.reset_password') }}"
        method="POST"
        id="reset-form"
        novalidate>
        <div class="input-group">
          <label for="password">New password</label>
          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="At least 8 characters"
              autocomplete="new-password"
              required
              minlength="8" />
            <button
              type="button"
              class="password-toggle"
              data-toggle-for="password"
              aria-label="Show password">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="strength-meter">
            <div class="strength-meter-fill" id="strength-fill"></div>
          </div>
        </div>

        <div class="input-group">
          <label for="confirm_password">Confirm new password</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            required />
          <span class="field-error" id="confirm-error"></span>
        </div>

        <button type="submit" class="login-btn" id="reset-submit">
          <span class="btn-label">Update Password</span>
          <svg
            class="btn-arrow"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
          <span class="spinner"></span>
        </button>
      </form>
    </div>

    <script src="{{ url_for('static', filename='auth.js') }}"></script>
  </body>
</html>
